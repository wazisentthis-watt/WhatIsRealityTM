name: YOUR Preview QA
on:
  pull_request:
    paths:
      - 'your/**'
      - '.github/workflows/your-preview-qa.yml'
  push:
    branches: [main]
    paths:
      - 'your/**'
      - '.github/workflows/your-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify YOUR markup, scripts and source boundaries
        run: node --test your/smoke.test.mjs
